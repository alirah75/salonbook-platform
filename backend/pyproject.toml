[project]
name = "salonbook-backend"
version = "0.1.0"
description = "Tenant-isolated salon booking API and persistence layer"
requires-python = ">=3.13,<3.15"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.8,<3",
    "argon2-cffi>=23.1,<26",
    "cryptography>=50,<51",
    "phonenumbers>=9,<10",
    "tzdata>=2026.1,<2027",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
    "mypy>=1.16,<2",
    "httpx2>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["postgres: requires Docker and a disposable PostgreSQL instance"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["app", "scripts"]
plugins = ["pydantic.mypy"]
